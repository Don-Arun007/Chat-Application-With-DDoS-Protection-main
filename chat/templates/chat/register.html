{% extends 'chat/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Register - ChatApp{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 56px);
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .auth-card {
        background: white;
        border-radius: 15px;
        padding: 2rem;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 450px;
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-header i {
        font-size: 3rem;
        color: var(--primary-color);
        margin-bottom: 1rem;
    }

    .auth-header h2 {
        color: var(--primary-color);
        font-weight: bold;
    }

    .btn-register {
        background-color: var(--secondary-color);
        color: white;
        padding: 0.75rem;
        font-size: 1.1rem;
        border: none;
        width: 100%;
    }

    .btn-register:hover {
        background-color: var(--primary-color);
        color: white;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-comment-dots"></i>
            <h2>Create Account</h2>
            <p class="text-muted">Join and start chatting!</p>
        </div>
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-register mt-3">
                <i class="fas fa-user-plus"></i> Register
            </button>
        </form>
        <div class="text-center mt-3">
            <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
